  <text x="602" y="676" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Use custom</text>
  <text x="602" y="712" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="26">Select a custom .img from your computer</text>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1366 894" role="img" aria-labelledby="title desc">
  <title id="title">Raspberry Pi Imager: Use custom image option</title>
  <desc id="desc">Screenshot-style guide image showing the Raspberry Pi Imager OS step with Use custom highlighted.</desc>
  <rect width="1366" height="894" rx="14" fill="#ffffff"/>
  <text x="38" y="70" fill="#c5003e" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Setup steps</text>

  <text x="58" y="158" fill="#c5003e" font-family="Arial, Helvetica, sans-serif" font-size="28">Device</text>
  <rect x="38" y="198" width="320" height="80" rx="8" fill="#c5003e"/>
  <text x="58" y="248" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28">OS</text>
  <text x="58" y="338" fill="#777777" font-family="Arial, Helvetica, sans-serif" font-size="28">Storage</text>
  <text x="58" y="428" fill="#777777" font-family="Arial, Helvetica, sans-serif" font-size="28">Customisation</text>
  <text x="58" y="518" fill="#777777" font-family="Arial, Helvetica, sans-serif" font-size="28">Writing</text>
  <text x="58" y="608" fill="#777777" font-family="Arial, Helvetica, sans-serif" font-size="28">Done</text>
  <line x1="405" y1="112" x2="405" y2="788" stroke="#a9a9a9" stroke-width="2"/>

  <text x="462" y="92" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">Choose operating system</text>
  <text x="462" y="152" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="30">Select an operating system to install on your Raspberry Pi</text>

  <g transform="translate(500 190)">
    <rect x="0" y="0" width="64" height="34" rx="4" fill="none" stroke="#111" stroke-width="5"/>
    <circle cx="15" cy="17" r="5" fill="#111"/>
    <circle cx="49" cy="17" r="5" fill="#111"/>
    <rect x="10" y="32" width="44" height="4" fill="#111"/>
  </g>
  <text x="602" y="218" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="28">client operating systems</text>

  <g transform="translate(498 328)" fill="none" stroke="#000" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="23" cy="21" r="14"/>
    <line x1="34" y1="32" x2="68" y2="66"/>
    <line x1="58" y1="56" x2="72" y2="42"/>

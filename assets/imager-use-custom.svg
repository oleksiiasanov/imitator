  </g>
  <text x="602" y="338" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Misc utility images</text>
  <text x="602" y="374" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="26">Bootloader EEPROM configuration, etc.</text>

  <g transform="translate(506 492)" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 12h54"/>
    <path d="M10 12l6 56h22l6-56"/>
    <path d="M19 0h16"/>
  </g>
  <text x="602" y="516" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Erase</text>
  <text x="602" y="552" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="26">Format card as FAT32</text>

  <rect x="466" y="588" width="814" height="164" fill="#f7f7f7" stroke="#ff6b00" stroke-width="14"/>
  <g transform="translate(506 648)" fill="none" stroke="#000" stroke-width="5" stroke-linejoin="round">
    <path d="M0 0h36l18 18v54H0z"/>
